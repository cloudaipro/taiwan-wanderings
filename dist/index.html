<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c27"><meta name="description" content="與旅伴小嵐一起探索台灣，尋找線索、破解五道謎題，收集屬於你們的島嶼回憶。">
<title>台灣漫遊錄 · 島嶼的五封信</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./game.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="台灣漫遊錄首頁"><span class="brand-seal">島</span><span><strong>台灣漫遊錄</strong><small>TAIWAN WANDERINGS</small></span></a>
  <span class="edition">島嶼的五封信 <span>／</span> 互動冒險</span>
  <nav aria-label="遊戲工具"><button id="journal-button" class="nav-button"><span aria-hidden="true">▤</span> 旅人手帳 <span id="stamp-count" class="count">0</span></button><button id="settings-button" class="icon-button" aria-label="設定">⚙</button></nav>
</header>
<div class="game-layout">
  <aside class="journey">
    <div class="journey-heading"><span class="eyebrow">YOUR JOURNEY</span><h2>我們的環島旅程</h2><p>五個地方，五段想珍藏的回憶。</p></div>
    <nav id="chapters" class="chapters" aria-label="選擇關卡"></nav>
    <div class="journey-bottom"><span class="eyebrow">島嶼回憶</span><div class="progress-caption"><strong id="completion-label">0 / 5</strong><span>枚印章已收集</span></div><progress id="journey-progress" max="5" value="0" aria-label="印章收集進度"></progress><p>不必趕路，故事會等你。</p></div>
  </aside>
  <main id="main">
    <div class="chapter-topline"><span><span class="live-dot"></span> 探索中 <span class="separator">/</span> <span id="breadcrumb">第一章 · 九份</span></span><button id="sound-button" class="text-button" aria-pressed="false">♪ 音效關閉</button></div>
    <section id="scene" class="scene" aria-labelledby="scene-title">
      <div id="scene-art" class="scene-art art-0" role="img" aria-label="九份山城動漫場景"></div><div class="scene-shade"></div><canvas id="particles" aria-hidden="true"></canvas>
      <div class="scene-heading"><span id="scene-region" class="scene-region">新北 · 山城</span><h1 id="scene-title">山城裡的微光</h1><p id="scene-subtitle">沿著燈火，找回第一頁回憶。</p></div>
      <div id="hotspots" class="hotspots"></div>
      <div class="scene-bottom"><span id="scene-time">18:30 · 雨後</span><span>點選場景標記，尋找線索 <span aria-hidden="true">⌖</span></span></div>
      <div class="quest-card"><div><span class="quest-symbol" aria-hidden="true">◇</span><span class="eyebrow">本章任務</span><span id="clue-count">0/3</span></div><p id="quest-text">尋找三處線索，點亮回憶燈籠</p><div id="clue-dots" class="clue-dots"></div><button id="puzzle-button" class="quest-action">查看任務線索 <span>↗</span></button></div>
    </section>
    <section class="dialogue" aria-label="旅伴對話">
      <div class="portrait-wrap"><img src="./assets/xiaolan.webp" alt="旅伴小嵐，短髮、橘色圍巾與旅行背包" class="portrait"><span>你的旅伴</span></div>
      <div class="dialogue-main"><div class="speaker-row"><h2>小嵐 <span>XIAO LAN</span></h2><span id="dialogue-mode" class="mode-label">離線劇情</span><button id="history-button" class="text-button">對話紀錄</button></div>
        <p id="speech" aria-live="polite"></p>
        <div class="dialogue-choices"><button id="hint-button">給我一點提示</button><button id="bond-button">很高興和你一起旅行</button></div>
        <form id="chat-form" class="chat-form"><label class="sr-only" for="chat-input">對小嵐說點什麼</label><input id="chat-input" maxlength="500" placeholder="對小嵐說點什麼…" autocomplete="off" required><button type="submit" id="send-button" aria-label="傳送訊息">↗</button></form>
      </div>
    </section>
    <footer class="game-footer"><span id="save-status">進度會自動保存在這台裝置</span><span>TAIWAN WANDERINGS <span>✦</span> 慢慢走，好好記得</span></footer>
  </main>
</div>
<dialog id="modal"><div class="modal-top"><span id="modal-eyebrow" class="eyebrow">TRAVEL JOURNAL</span><button id="modal-close" class="icon-button" aria-label="關閉視窗">✕</button></div><div id="modal-content"></div></dialog>
<div id="toast" class="toast" role="status"></div>
</body></html>
